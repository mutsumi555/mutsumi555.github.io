<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#9c3b3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>考研政治一页纸 · 知识点手机版</title>
<style>
:root{
  --bg:#f6f1e9; --card:#fffdf9; --ink:#2b2622; --ink2:#5c534c; --ink3:#8b8178;
  --line:#ece2d4; --brand:#9c3b3b; --brand2:#c0703f; --blue:#2d5bd1; --red:#d63a2f;
  --orange:#ef7d2d; --ok:#2f8f5b; --head:#fbf3e6;
  --radius:14px;
  --fs:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden}
body{
  background:var(--bg); color:var(--ink);
  font:var(--fs)/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  -webkit-font-smoothing:antialiased; text-size-adjust:100%;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
}
/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#9c3b3b,#b5543b);
  color:#fff;padding:10px 12px 0;box-shadow:0 2px 10px rgba(60,30,20,.18)}
.tb-row{display:flex;align-items:center;gap:10px}
.tb-title{font-size:16px;font-weight:700;line-height:1.3;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:11.5px;line-height:1.5;opacity:.85;margin-top:1px;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:34px;height:34px;border:0;border-radius:10px;background:rgba(255,255,255,.16);
  color:#fff;font-size:16px;display:grid;place-items:center;cursor:pointer}
.iconbtn:active{background:rgba(255,255,255,.3)}
.seg{display:flex;gap:6px;margin:10px 0 10px;background:rgba(0,0,0,.13);padding:4px;border-radius:12px;
  position:relative;isolation:isolate}
.seg button{display:block;width:0;flex:1 1 0;min-width:0;border:0;background:transparent;color:#fff;font-size:13.5px;
  font-weight:600;padding:9px 6px;border-radius:9px;cursor:pointer;font-family:inherit;white-space:nowrap;
  letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;text-align:center;line-height:1.4}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(60,20,10,.18)}
/* ---------- 搜索 ---------- */
.searchwrap{padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);z-index:20}
.search{display:flex;align-items:center;gap:8px;background:#f2ece2;border-radius:12px;padding:8px 10px}
.search input{flex:1;border:0;background:transparent;font-size:15px;font-family:inherit;
  outline:none;color:var(--ink);min-width:0}
.search input::placeholder{color:#a99e93}
.search .clr{border:0;background:#d9cfc2;color:#fff;border-radius:50%;width:20px;height:20px;
  font-size:12px;line-height:1;display:none;cursor:pointer}
.search.has .clr{display:grid;place-items:center}
/* ---------- 筛选 chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;
  background:#fff;border-bottom:1px solid var(--line);z-index:19}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink2);
  border-radius:999px;padding:5px 12px;font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
/* ---------- 卡片 ---------- */
main{padding:12px 12px 30px;max-width:760px;margin:0 auto}
.grouphead{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-size:13px;
  color:var(--brand);font-weight:700;letter-spacing:.04em}
.grouphead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grouphead:first-child{margin-top:2px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  margin:0 0 12px;box-shadow:0 1px 2px rgba(80,50,30,.05);overflow:hidden}
.card > summary{list-style:none;cursor:pointer;padding:12px 14px;background:linear-gradient(180deg,#fffdf9,#fdf7ee);
  border-left:4px solid var(--brand);display:flex;gap:10px;align-items:flex-start}
.card > summary::-webkit-details-marker{display:none}
.card > summary .t{flex:1;min-width:0;font-size:clamp(16px,4.5vw,17.5px);font-weight:700;line-height:1.45;
  word-break:break-word}
.card > summary .t .badge{display:inline-block;font-size:11px;font-weight:600;color:#8a7461;
  background:#f3e9da;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.card > summary .arrow{flex:0 0 auto;color:#b9ab9c;transition:transform .2s;font-size:13px;margin-top:6px}
.card[open] > summary .arrow{transform:rotate(90deg)}
.card.flash{animation:flash 1.3s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px rgba(214,58,47,.55)}100%{box-shadow:0 1px 2px rgba(80,50,30,.05)}}
.card .body{padding:10px 14px 14px;border-top:1px dashed var(--line)}
.card .preview{padding:0 14px 12px;color:var(--ink2);font-size:13.5px;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word}
.card[open] .preview{display:none}
/* 内容块 */
.b p{margin:6px 0;word-break:break-word;overflow-wrap:anywhere}
.b p:first-child,.b .s:first-child{margin-top:2px}
.b .q{margin:6px 0;color:#3b3631;word-break:break-word}
.b .q::after{content:"  ▽";color:#c4a98f;font-size:.8em;letter-spacing:-1px}
.b .a{
    --red:#d63a2f;
    margin:3px 0 10px 0;display:flex;gap:8px;align-items:flex-start;color:var(--red);font-weight:600;
    padding:6px 10px;background:#fdf0ec;border-left:3px solid #e9a294;border-radius:8px;word-break:break-word}
.b .a::before{content:"答";flex:0 0 auto;font-size:10.5px;color:#fff;background:var(--red);
  border-radius:4px;padding:1px 4px;line-height:1.4;margin-top:.28em;font-weight:700}
.b .s{margin:16px 0 6px;font-weight:700;color:#7a4a1f;display:flex;align-items:center;gap:8px}
.b .s::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--brand2)}
.b .s:first-child{margin-top:4px}
.b .o{margin:4px 0 4px 0;padding-left:1.25em;text-indent:-1.25em;color:var(--blue);word-break:break-word}
.b .o:first-child{margin-top:0}
.b .l{margin:5px 0;padding-left:1.1em;text-indent:-1.1em;color:var(--ink2);word-break:break-word}
.b .x{display:inline-block;font-size:11.5px;line-height:1.5;color:#9a8b7c;background:#f4ece1;
  border-radius:6px;padding:0 6px;margin:2px 4px 2px 0;white-space:nowrap;font-weight:600}
.b .x.hot{color:#fff;background:var(--red)}
/* 高亮：原文的重点词 */
.r{color:var(--red);font-weight:600}
.e{color:#b04a3a;font-weight:600}
.b2{color:var(--blue)}
.o2{color:var(--orange)}
mark{background:linear-gradient(180deg,transparent 55%,#ffe08a 55%);color:inherit;padding:0 .05em;border-radius:3px}
/* ---------- 搜索空状态 ---------- */
.empty{text-align:center;color:var(--ink3);padding:40px 20px;font-size:14px;line-height:2}
/* ---------- 底部工具条 ---------- */
.toolbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:rgba(255,253,249,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.toolbar button{flex:1;border:0;background:transparent;font-family:inherit;font-size:12px;
  color:var(--ink2);padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.toolbar button .ic{font-size:17px;line-height:1}
.toolbar button.on{color:var(--brand);font-weight:700}
/* ---------- 目录抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(30,20,15,.42);z-index:50;opacity:0;pointer-events:none;
  transition:opacity .2s}
.mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(84vw,340px);z-index:60;background:#fffdf9;
  transform:translateX(-102%);transition:transform .24s ease;display:flex;flex-direction:column;
  box-shadow:4px 0 24px rgba(60,30,20,.2)}
.drawer.show{transform:none}
.drawer .dh{padding:14px 16px;background:linear-gradient(135deg,#9c3b3b,#b5543b);color:#fff;
  font-weight:700;font-size:15px}
.drawer .dl{flex:1;overflow:auto;padding:6px 0 24px;-webkit-overflow-scrolling:touch}
.drawer .dl a{display:block;padding:10px 16px;color:var(--ink);text-decoration:none;font-size:14.5px;
  border-bottom:1px solid #f4ede3;display:flex;justify-content:space-between;gap:10px}
.drawer .dl a .n{color:#b6a795;font-size:12px}
.drawer .dl a.s1{padding-left:16px;font-weight:700;background:#faf4ea}
.drawer .dl a.s2{padding-left:32px;color:var(--ink2);font-size:14px}
/* ---------- 设置面板 ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fffdf9;border-radius:18px 18px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(110%);
  transition:transform .24s ease;box-shadow:0 -6px 24px rgba(60,30,20,.18)}
.sheet.show{transform:none}
.sheet h3{margin:0 0 12px;font-size:15px}
.sheet .row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;
  border-bottom:1px solid #f4ede3;font-size:14px}
.sheet .row:last-of-type{border-bottom:0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-size:17px;line-height:1;cursor:pointer;font-family:inherit;color:var(--ink)}
.stepper span{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.switch{position:relative;flex:0 0 auto;width:46px;height:26px;border-radius:99px;background:#d9cfc2;border:0;
  padding:0;cursor:pointer;transition:background .2s;color:transparent;font-size:0;overflow:hidden}
.switch.on{background:var(--ok)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on::after{transform:translateX(20px)}
/* ---------- 轻提示 ---------- */
.toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,10px);background:rgba(43,38,34,.92);
  color:#fff;font-size:13px;padding:8px 14px;border-radius:10px;opacity:0;pointer-events:none;
  transition:all .2s;z-index:80;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ---------- 回到顶部 ---------- */
.totop{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:35;width:42px;height:42px;
  border-radius:50%;border:1px solid var(--line);background:#fffdf9;color:var(--brand);font-size:17px;
  box-shadow:0 4px 14px rgba(80,50,30,.16);cursor:pointer;display:none;place-items:center}
.totop.show{display:grid}
@media (min-width:820px){
  body{--fs:16.5px}
  main{padding:16px 20px 40px}
}
</style>
</head>

    <button data-book="fj" id="segFj" style="display:block;flex:1 1 0;width:0;min-width:0;border:0;border-radius:9px;font:600 13.5px/1.4 inherit;padding:9px 6px;background:transparent;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer">解题方法</button>

<nav class="chips" id="chips" hidden></nav>

<main id="list"></main>

</aside>

  <div class="row" style="color:var(--ink3);font-size:12.5px;line-height:1.6;display:block">
    本站内容提取自两册 PDF 的前置知识点/方法部分，仅供个人复习使用。
  </div>
</div>
<div class="toast" id="toast"></div>

<footer class="toolbar">
  <button id="tb0" class="on"><span class="ic">📖</span>知识点</button>
  <button id="tb1"><span class="ic">🧭</span>解题方法</button>
  <button id="tb2"><span class="ic">☰</span>目录</button>
  <button id="tb3"><span class="ic">Aa</span>设置</button>

<script>
(function(){
  "use strict";
  const BOOK = window.BOOK || {kp:[],fj:[]};

  const LS = {
    get(k,d){ try{ const v = localStorage.getItem('yzyz-'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem('yzyz-'+k, JSON.stringify(v)); }catch(e){} }
  };
  let state = {
    book: LS.get('book','kp'),
    q: '',
    sec: null,
    open: LS.get('open', false),
    plain: LS.get('plain', false),
    fs: LS.get('fs', 16)
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ---- 重点词高亮：只给关键信号上色，避免整页花掉 ---- */
  // 正文中只高亮“墓碑词/绝对词”这类考试信号词；疑问句末的冒号交给问答样式处理
  const RULE = [
    [/根本|本质|唯一|一定|必须|绝对|所有|一切|总是|始终|任何|只能|只是|只有|单纯|纯粹|已经|实现了|完成了|决定|取决于|取代|代替|主导|主要|主线|全面|完整|必然/g, 'r'],
    [/不能|不会|不一定|≠|错误|错的|排除|趋于缓和|可有可无/g, 'e']
  ];
  function decorate(text){
    const s = String(text);
    // 按长度决定上色密度：长段落少上色，短句可以多点
    let html = esc(s);
    const marks = [];
    const cap = s.length > 90 ? 2 : 4;
    let n = 0;
    for (const [re, cls] of RULE){
      html = html.replace(re, m => {
        if (n >= cap) return m;
        n++;
        return `\u0001${marks.push(`<span class="${cls}">${m}</span>`) - 1}\u0002`;
      });
    }
    return html.replace(/\u0001(\d+)\u0002/g, (_, i) => marks[+i]);
  }

  function qaSplit(items){
    // 把「问句（以：结尾）」与其后的「答案行」配成对，显示成问答样式
    const out = [];
    for (let i=0;i<items.length;i++){
      const [k, t, tag] = items[i];
      if (k === 'p' && /[：:]$/.test(t) && items[i+1] && items[i+1][0]==='p'
          && !/[：:]$/.test(items[i+1][1]) && t.length <= 40 && items[i+1][1].length <= 40
          && !/^(注|总结|说明)/.test(items[i+1][1])) {
        out.push(['q', t, tag]); out.push(['a', items[i+1][1]]); i++;
      } else {
        out.push(items[i]);
      }
    }
    return out;
  }

  function cardHTML(card, idx, hiq){
    const body = state.plain ? card.b : qaSplit(card.b);
    let h = '';
    for (const it of body){
      const kind = it[0], text = it[1], tag = it[2];
      let cls = kind === 'q' ? 'q' : kind === 'a' ? 'a' : kind === 's' ? 's' : kind === 'o' ? 'o' : kind === 'l' ? 'l' : kind === 'x' ? 'x' : 'p';
      let inner = state.plain ? esc(text) : decorate(text);
      if (hiq && hiq.length) inner = hiqHTML(inner, hiq);
      if (kind === 'x') { h += `<span class="x ${/^(20[12]\d)/.test(text)?'hot':''}">${esc(text)}</span>`; continue; }
      h += `<div class="${cls}">${inner}</div>`;
      if (tag) h += `<span class="x ${/^(20[12]\d)/.test(tag)?'hot':''}">${esc(tag)}</span>`;
    }
    const sub = card.s && state.book === 'kp' ? `<span class="badge">${esc(card.s)}</span>` : '';
    const preview = (card.b.find(x=>x[0]==='p'||x[0]==='l'||x[0]==='o') || card.b[0])[1];
    return `<details class="card" id="c${idx}" data-title="${esc(card.t)}" ${state.open?'open':''}>
      <summary><span class="t">${sub}${esc(card.t)}</span><span class="arrow">▶</span></summary>
      <div class="preview">${esc(preview)}</div>
      <div class="body b">${h}</div>
    </details>`;
  }

  function hiqHTML(html, words){
    // 已含标签的 HTML 中高亮查询词：按文本片段处理，避免破坏标签
    let out = '';
    const parts = html.split(/(<[^>]+>)/);
    for (const p of parts){
      if (p.startsWith('<')) { out += p; continue; }
      let s = p;
      for (const w of words){
        if (!w) continue;
        const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g');
        s = s.replace(re, m => `\u0003${m}\u0004`);
      }
      s = s.replace(/\u0003([^\u0004]*)\u0004/g, '<mark>$1</mark>');
      out += s;
    }
    return out;
  }

  function currentCards(){
    return BOOK[state.book] || [];
  }

  function groups(cards){
    const map = new Map();
    for (const c of cards){
      const key = state.book === 'kp' ? (c.s || '其他') : (c.s || '方法');
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(c);
    }
    return map;
  }

  function renderChips(cards){
    const box = $('#chips');
    if (!cards.length){ box.hidden = true; return; }
    box.hidden = false;
    const secs = Array.from(new Set(cards.map(c => state.book==='kp' ? (c.s||'其他') : (c.s||'方法'))));
    if (state.q || secs.length < 2){ box.hidden = true; return; }
    let h = `<button class="chip ${state.sec?'':'on'}" data-sec="">全部</button>`;
    for (const s of secs) h += `<button class="chip ${state.sec===s?'on':''}" data-sec="${esc(s)}">${esc(s)}</button>`;
    box.innerHTML = h;
  }

  function render(keepScroll){
    const y = window.scrollY;
    let cards = currentCards();
    const q = state.q.trim().toLowerCase();
    let hiq = [];
    if (q){
      hiq = [q];
      cards = cards.filter(c => {
        const hay = (c.t + ' ' + (c.s||'') + ' ' + c.b.map(x=>x[1]+(x[2]||'')).join(' ')).toLowerCase();
        return hay.includes(q);
      });
    }
    if (state.sec) cards = cards.filter(c => (state.book==='kp'? (c.s||'其他') : (c.s||'方法')) === state.sec);
    renderChips(currentCards());
    const list = $('#list');
    if (!cards.length){
      list.innerHTML = `<div class="empty">没有找到「${esc(state.q)}」相关的知识点<br>换个关键词试试，比如：实践、根本、土地、会议</div>`;
    } else if (q){
      list.innerHTML = `<div class="grouphead">搜索结果 · ${cards.length} 条</div>` + cards.map((c,i)=>cardHTML(c,i,hiq)).join('');
    } else {
      const g = groups(cards);
      let h = '';
      for (const [sec, arr] of g){
        if (state.book === 'kp' && g.size > 1) h += `<div class="grouphead">${esc(sec)} · ${arr.length}</div>`;
        h += arr.map((c,i)=>cardHTML(c, i, hiq)).join('');
      }
      list.innerHTML = h;
    }
    if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  }

  function renderToc(){
    const cards = currentCards();
    const g = groups(cards);
    const m = new Map();     // 先统计同名卡片（跨页续写会重名），用于生成定位键
    for (const c of cards) m.set(c.t, (m.get(c.t) || 0) + 1);
    const seen = new Map();
    let h = `<a href="#" class="s1" data-top="1">全部内容<span class="n">${cards.length}</span></a>`;
    for (const [sec, arr] of g){
      h += `<a href="#" data-sec-jump="${esc(sec)}" class="s1">${esc(sec)}<span class="n">${arr.length}</span></a>`;
      for (const c of arr){
        const k = (seen.get(c.t) || 0) + 1;
        seen.set(c.t, k);
        const label = m.get(c.t) > 1 ? `${c.t}（${k}）` : c.t;
        h += `<a href="#" data-card="${esc(c.t)}" data-k="${k}" class="s2">${esc(label)}</a>`;
      }
    }
    $('#drawerList').innerHTML = h;
    $('#drawerHead').textContent = state.book === 'kp' ? '知识点手册 · 目录' : '解题方法 · 目录';
  }

  /* ---------------- 交互 ---------------- */
  function setBook(b){
    state.book = b; state.sec = null; state.q = ''; $('#q').value = ''; $('#searchBox').classList.remove('has');
    LS.set('book', b);
    $$('#seg button').forEach(x => {
      const on = x.dataset.book === b;
      x.classList.toggle('on', on);
      x.style.background = on ? '#fff' : 'transparent';
      x.style.color = on ? '#9c3b3b' : '#fff';
    });
    $('#tb0').classList.toggle('on', b==='kp'); $('#tb1').classList.toggle('on', b==='fj');
    $('#tbTitle').textContent = '考研政治一页纸';
    $('#tbSub').textContent = b==='kp'
      ? '知识点手册 · 共 ' + BOOK.kp.length + ' 个知识点'
      : '解题方法手册 · 共 ' + BOOK.fj.length + ' 个方法块';
    /* ---------- 字体自适应（卡片较多，统一靠 fit 拉伸） ---------- */
    (function autoFit(){
      const fit = () => {
        const W = Math.max(240, document.documentElement.clientWidth);
        const spans = [118, 150, 190];
        const f = v => { let s = 13.5; if (W <= spans[0]) s = 12; else if (W <= spans[1]) s = 12.8; else if (W <= spans[2]) s = 13.2; return s; };
        $$('#seg button').forEach(b => { b.style.fontSize = f(W) + 'px'; });
      };
      fit();
      window.addEventListener('resize', fit, {passive:true});
    })();

    renderToc(); render();
  }

  // resize: keep the segmented control inside the bar
  window.addEventListener('resize', function(){
    var W = Math.max(240, document.documentElement.clientWidth);
    var s = W <= 360 ? 12 : (W <= 400 ? 12.8 : 13.5);
    $$('#seg button').forEach(function(b){ b.style.fontSize = s + 'px'; });
  }, {passive:true});

  $('#seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setBook(b.dataset.book); });
  $('#tb0').onclick = () => setBook('kp');
  $('#tb1').onclick = () => setBook('fj');
  $('#tb2').onclick = openDrawer;
  $('#tb3').onclick = openSheet;

  $('#btnSearch').onclick = () => {
    const w = $('#searchwrap');
    w.hidden = !w.hidden;
    if (!w.hidden){ $('#q').focus(); }
    else { state.q=''; $('#q').value=''; $('#searchBox').classList.remove('has'); render(); }
  };
  $('#q').addEventListener('input', e => {
    state.q = e.target.value;
    $('#searchBox').classList.toggle('has', !!state.q);
    render();
  });
  $('#qClear').onclick = () => { $('#q').value=''; state.q=''; $('#searchBox').classList.remove('has'); render(); $('#q').focus(); };

  $('#chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b) return;
    state.sec = b.dataset.sec || null;
    render(true);
  });

  function openDrawer(){ renderToc(); $('#drawer').classList.add('show'); $('#mask').classList.add('show'); }
  function closeAll(){ $('#drawer').classList.remove('show'); $('#sheet').classList.remove('show'); $('#mask').classList.remove('show'); }
  $('#mask').onclick = closeAll;
  $('#btnToc').onclick = openDrawer;
  $('#drawerList').addEventListener('click', e => {
    const a = e.target.closest('a'); if(!a) return;
    e.preventDefault();
    if (a.dataset.top){ state.sec = null; state.q=''; $('#q').value=''; render(); closeAll(); return; }
    const title = a.dataset.card;
    if (title){
      state.sec = null; state.q = ''; $('#q').value=''; $('#searchBox').classList.remove('has');
      $('#searchwrap').hidden = true;
      render();
      const k = a.dataset.k ? +a.dataset.k : 1;
      const pool = $$('details.card').filter(d => d.dataset.title === title);
      const target = pool[Math.min(k, pool.length) - 1];
      closeAll();
      if (target){
        target.open = true;
        const y = target.getBoundingClientRect().top + window.scrollY - 120;
        window.scrollTo(0, Math.max(0, y));
        target.classList.add('flash');
        setTimeout(() => target.classList.remove('flash'), 1400);
      }
      return;
    }
    const sec = a.dataset.secJump;
    if (sec){ state.sec = sec; state.q=''; $('#q').value=''; render(); }
    else { state.sec = null; render(); }
    closeAll();
  });

  function openSheet(){ $('#sheet').classList.add('show'); $('#mask').classList.add('show'); syncSheet(); }
  function syncSheet(){
    $('#fsVal').textContent = state.fs;
    $('#swOpen').classList.toggle('on', state.open);
    $('#swPlain').classList.toggle('on', state.plain);
    document.documentElement.style.setProperty('--fs', state.fs + 'px');
  }
  function applyFs(v){
    state.fs = Math.min(21, Math.max(14, v));
    LS.set('fs', state.fs);
    syncSheet();
  }
  $('#fsMinus').onclick = () => applyFs(state.fs - 1);
  $('#fsPlus').onclick = () => applyFs(state.fs + 1);
  $('#swOpen').onclick = () => {
    state.open = !state.open; LS.set('open', state.open); syncSheet();
    $$('details.card').forEach(d => d.open = state.open);
  };
  $('#swPlain').onclick = () => { state.plain = !state.plain; LS.set('plain', state.plain); syncSheet(); render(true); };

  // 卡片之间手风琴（同一时间只展开一张可选）: 这里采用自由折叠
  document.addEventListener('click', e => { /* 占位 */ });

  const totop = $('#totop');
  window.addEventListener('scroll', () => { totop.classList.toggle('show', window.scrollY > 900); }, {passive:true});
  totop.onclick = () => window.scrollTo({top:0, behavior:'smooth'});

  // 支持 ?q=关键词 直接搜索
  const m = location.search.match(/[?&]q=([^&]+)/);
  syncSheet();
  setBook(state.book);
  if (m){ state.q = decodeURIComponent(m[1]); $('#searchwrap').hidden = false; $('#q').value = state.q; render(); }
})();
</script>
</body>
</html>
